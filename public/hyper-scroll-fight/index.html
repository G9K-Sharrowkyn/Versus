<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIGHT INTRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;800&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; cursor: none !important; }

    :root {
      --bg: linear-gradient(0deg, #000 0%, #280604 100%);
      --card-bg: rgba(10, 10, 10, 0.4);
      --text: #e0e0e0;
      --accent: #ff003c;
      --accent-2: #00f3ff;
      --border: rgba(255, 255, 255, 0.1);
      --font-display: 'Chakra Petch', 'Syncopate', sans-serif;
      --font-code: 'Chakra Petch', 'JetBrains Mono', monospace;
    }

    body {
      margin: 0; padding: 0;
      background: var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: var(--font-display);
      overflow: hidden;
      width: 100vw; height: 100vh;
    }

    /* --- POST PROCESSING & OVERLAYS --- */
    .scanlines {
      position: fixed; inset: 0;
      background: linear-gradient(to bottom,
        rgba(255,255,255,0),
        rgba(255,255,255,0) 50%,
        rgba(0,0,0,0.2) 50%,
        rgba(0,0,0,0.2));
      background-size: 100% 4px;
      pointer-events: none; z-index: 10;
    }
    .vignette {
      position: fixed; inset: 0;
      background: radial-gradient(circle, transparent 40%, #000 120%);
      z-index: 11; pointer-events: none;
    }
    .noise {
      display: none;
      position: fixed; inset: 0; z-index: 12; opacity: 0.07; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* --- HUD --- */
    .hud {
      position: fixed; inset: 2rem; z-index: 20; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      font-family: var(--font-code); font-size: 10px;
      color: rgba(255,255,255,0.5); text-transform: uppercase;
    }
    .hud-top, .hud-bottom { display: flex; justify-content: space-between; align-items: center; }
    .hud strong { color: var(--accent-2); }
    .hud-line {
      flex: 1; height: 1px;
      background: rgba(255,255,255,0.2);
      margin: 0 1rem; position: relative;
    }
    .hud-line::after {
      content: ''; position: absolute; right: 0; top: -2px;
      width: 5px; height: 5px; background: var(--accent);
    }

    /* --- 3D SCENE --- */
    .viewport {
      position: fixed; inset: 0;
      perspective: 1000px;
      overflow: hidden; z-index: 1;
    }
    .world {
      position: absolute; top: 50%; left: 50%;
      transform-style: preserve-3d;
      will-change: transform;
    }
    .item {
      position: absolute; left: 0; top: 0;
      backface-visibility: hidden;
      transform-origin: center center;
      display: flex; align-items: center; justify-content: center;
    }

    /* --- CARDS --- */
    .card {
      width: 320px; height: 460px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      position: relative;
      padding: 2rem;
      display: flex; flex-direction: column; justify-content: space-between;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.5), 0 20px 50px rgba(0,0,0,0.5);
      transition: all 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
      transform: translate(-50%,-50%);
      overflow: hidden;
    }
    .card::before, .card::after {
      content: ''; position: absolute;
      width: 10px; height: 10px;
      border: 1px solid transparent; transition: 0.3s;
    }
    .card::before { top: -1px; left: -1px; border-top-color: var(--text); border-left-color: var(--text); }
    .card::after  { bottom: -1px; right: -1px; border-bottom-color: var(--text); border-right-color: var(--text); }

    /* --- CARD BACKGROUND IMAGE --- */
    .card-media {
      position: absolute;
      left: 1rem;
      right: 1rem;
      top: 4.8rem;
      bottom: 3.4rem;
      overflow: hidden;
      border: 1px solid rgba(255, 85, 78, 0.24);
      background: rgba(0, 0, 0, 0.24);
      box-shadow:
        inset 0 0 0 1px rgba(255, 85, 78, 0.24),
        0 0 0 1px rgba(255, 85, 78, 0.12),
        0 0 18px rgba(255, 85, 78, 0.08);
      z-index: 0;
    }
    .card-media::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(255, 85, 78, 0.04), transparent 22%, transparent 78%, rgba(255, 85, 78, 0.06)),
        linear-gradient(to bottom,
          rgba(255,255,255,0) 0%,
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.16) 50%,
          rgba(0,0,0,0.16) 100%);
      background-size: 100% 100%, 100% 4px;
      pointer-events: none;
    }
    .card-media::before {
      content: '';
      position: absolute;
      inset: 0.55rem;
      border: 1px solid rgba(255, 85, 78, 0.42);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.05),
        0 0 0 1px rgba(255, 85, 78, 0.18);
      pointer-events: none;
      z-index: 1;
    }
    .card-bg-image {
      position: absolute;
      inset: 0.55rem;
      width: calc(100% - 1.1rem);
      height: calc(100% - 1.1rem);
      display: block;
      object-fit: cover;
      object-position: center top;
      opacity: 0.82;
      filter: saturate(0.96) contrast(1.04) brightness(0.82);
      transform: scale(1.01);
      z-index: 0;
    }
    .card-header, .card-footer { position: relative; z-index: 1; }

    .card-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem; margin-bottom: 1rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .card-id { font-family: var(--font-code); color: var(--accent); font-size: 0.8rem; }
    .card-footer {
      margin-top: auto; font-family: var(--font-code);
      font-size: 0.7rem; color: rgba(255,255,255,0.4);
      display: flex; justify-content: space-between;
    }

    /* --- SIGNAL PANELS --- */
    .signal-card {
      --signal-main-bg: rgba(255, 85, 78, 0.96);
      --signal-main-glow: rgba(255, 85, 78, 0.32);
      position: relative;
      width: min(78vw, 1160px);
      padding: 1.1rem 1.2rem 1rem;
      border: 1px solid rgba(255, 85, 78, 0.5);
      background:
        linear-gradient(180deg, rgba(26, 7, 7, 0.86), rgba(8, 3, 3, 0.92)),
        linear-gradient(0deg, rgba(255, 85, 78, 0.05), rgba(255, 85, 78, 0));
      box-shadow:
        inset 0 0 0 1px rgba(255, 85, 78, 0.08),
        0 0 32px rgba(255, 48, 36, 0.12);
      transform: translate(-50%, -50%);
      pointer-events: none;
      overflow: hidden;
    }
    .signal-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom,
          rgba(255,255,255,0) 0%,
          rgba(255,255,255,0) 50%,
          rgba(0,0,0,0.18) 50%,
          rgba(0,0,0,0.18) 100%);
      background-size: 100% 4px;
      opacity: 0.32;
      pointer-events: none;
    }
    .signal-corners,
    .signal-corners::before,
    .signal-corners::after,
    .signal-card::after {
      position: absolute;
      width: 18px;
      height: 18px;
      content: '';
      border-color: rgba(255, 85, 78, 0.95);
      pointer-events: none;
    }
    .signal-corners {
      inset: 0;
      border-top: 3px solid rgba(255, 85, 78, 0.95);
      border-left: 3px solid rgba(255, 85, 78, 0.95);
      width: 18px;
      height: 18px;
    }
    .signal-corners::before {
      top: 0;
      right: -18px;
      border-top: 3px solid rgba(255, 85, 78, 0.95);
      border-right: 3px solid rgba(255, 85, 78, 0.95);
    }
    .signal-corners::after {
      bottom: -18px;
      left: 0;
      border-bottom: 3px solid rgba(255, 85, 78, 0.95);
      border-left: 3px solid rgba(255, 85, 78, 0.95);
    }
    .signal-card::after {
      right: 0;
      bottom: 0;
      border-right: 3px solid rgba(255, 85, 78, 0.95);
      border-bottom: 3px solid rgba(255, 85, 78, 0.95);
    }
    .signal-kicker {
      position: relative;
      z-index: 1;
      margin-bottom: 0.85rem;
      font-family: var(--font-display);
      font-size: clamp(24px, 2.3vw, 40px);
      color: rgba(255, 85, 78, 0.9);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .signal-main {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      text-align: center;
      margin-bottom: 0.95rem;
      padding: 0.32em 0.38em 0.28em;
      background: var(--signal-main-bg);
      color: #050505;
      font-family: var(--font-code);
      font-size: clamp(34px, 4vw, 78px);
      line-height: 1;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      box-shadow: 0 0 24px var(--signal-main-glow);
      text-shadow: none;
    }
    .signal-card.is-fighter-a {
      --signal-main-bg: rgba(119, 226, 242, 0.96);
      --signal-main-glow: rgba(119, 226, 242, 0.28);
    }
    .signal-lines {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 0.16rem;
      font-family: var(--font-code);
      font-size: clamp(16px, 1.2vw, 24px);
      color: rgba(255, 85, 78, 0.86);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .signal-line {
      white-space: nowrap;
    }

    /* --- PARTICLES --- */
    .star {
      position: absolute; width: 2px; height: 2px;
      background: white; transform: translate(-50%,-50%);
    }
  </style>
</head>
<body>

  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="noise"></div>

  <div class="hud">
    <div class="hud-top">
      <span>PROJECT ARES // FIGHT LOADING</span>
      <div class="hud-line"></div>
      <span>FPS: <strong id="fps">60</strong></span>
    </div>
    <div style="align-self:flex-start;margin-top:auto;margin-bottom:auto;writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--font-code);font-size:10px;color:rgba(255,255,255,0.5);text-transform:uppercase;">
      SPEED // <strong id="vel-readout">0.00</strong>
    </div>
    <div class="hud-bottom">
      <span>COORD: <strong id="coord">000</strong></span>
      <div class="hud-line"></div>
      <span>VVV.NEXUS-OS</span>
    </div>
  </div>

  <div class="viewport" id="viewport">
    <div class="world" id="world"></div>
  </div>

  <script>
  (() => {
    // --- URL PARAMS ---
    const params = new URLSearchParams(location.search);
    const FIGHTER_A = (params.get('a') || 'FIGHTER A').toUpperCase();
    const FIGHTER_B = (params.get('b') || 'FIGHTER B').toUpperCase();
    const FOLDER    = params.get('folder') || '';

    // --- CONFIGURATION ---
    const CONFIG = {
      itemCount: 15,
      starCount: 150,
      zGap: 800,
      loopSize: 0,
      camSpeed: 2.5,
      colors: ['#ff003c', '#00f3ff', '#ccff00', '#ffffff']
    };
    CONFIG.loopSize = CONFIG.itemCount * CONFIG.zGap; // used only for stars

    const SIGNAL_PANELS = {
      intro: {
        kicker: 'EVALUATION MATRIX READY',
        main: '[ 0.000024 ] combat vectors drift-ready',
        lines: [
          'ARCHIVE :: PROJECT_ARES      [PRIMARY SHARD]',
          'HALO    :: VERSUSVERSEVAULT  [EDGE GATE]',
          `MATCH   :: ${FIGHTER_A} // ${FIGHTER_B}`,
          'STATUS  :: PRE-FIGHT SCAN    [WINDOW OPEN]'
        ]
      },
      fighterA: {
        kicker: 'COMBATANT PROFILE INDEXED',
        main: FIGHTER_A,
        className: 'is-fighter-a',
        lines: [
          'HALO :: VERSUSVERSEVAULT [PROJECT ARES]',
          'STATUS :: EXTREME THREAT',
          `A. NAME :: ${FIGHTER_A}`,
          `MATCH :: ${FIGHTER_A} // ${FIGHTER_B}`
        ]
      },
      fighterB: {
        kicker: 'COMBATANT PROFILE INDEXED',
        main: FIGHTER_B,
        lines: [
          'HALO :: VERSUSVERSEVAULT [PROJECT ARES]',
          'STATUS :: EXTREME THREAT',
          `A. NAME :: ${FIGHTER_B}`,
          `MATCH :: ${FIGHTER_A} // ${FIGHTER_B}`
        ]
      }
    };
    const buildFightImageUrl = (fileName) =>
      FOLDER && fileName
        ? `/api/fights/image?key=${encodeURIComponent(FOLDER)}&file=${encodeURIComponent(fileName)}`
        : '';

    const fetchFightImageFiles = async () => {
      if (!FOLDER) return [];
      try {
        const response = await fetch(`/api/fights/images?key=${encodeURIComponent(FOLDER)}`, { cache: 'no-store' });
        if (!response.ok) return [];
        const payload = await response.json();
        return Array.isArray(payload.files)
          ? payload.files.filter((file) => typeof file === 'string' && file.trim())
          : [];
      } catch {
        return [];
      }
    };

    const STAGE_BLUEPRINT = [
      { type: 'panel', panel: SIGNAL_PANELS.intro },
      { type: 'cards' },
      { type: 'cards' },
      { type: 'cards' },
      { type: 'panel', panel: SIGNAL_PANELS.fighterA },
      { type: 'cards' },
      { type: 'cards' },
      { type: 'cards' },
      { type: 'panel', panel: SIGNAL_PANELS.fighterB },
      { type: 'cards' },
      { type: 'cards' },
      { type: 'cards' },
      { type: 'cards' },
      { type: 'cards' },
      { type: 'cards', final: true },
    ];
    const BURST_STAGE_CENTERS = [
      { x: -0.42, y: -0.24 },
      { x: 0.4, y: -0.24 },
      { x: -0.38, y: 0.18 },
      { x: 0.38, y: 0.16 },
      { x: -0.08, y: -0.28 },
      { x: 0.1, y: 0.24 },
      { x: -0.46, y: -0.02 },
      { x: 0.46, y: -0.02 },
      { x: -0.24, y: 0.28 },
      { x: 0.24, y: -0.3 },
      { x: -0.02, y: 0.06 },
      { x: 0.02, y: -0.08 },
    ];
    const BURST_LAYOUTS = {
      1: [{ x: 0, y: 0, rot: -4 }],
      2: [
        { x: -0.42, y: -0.02, rot: -18 },
        { x: 0.42, y: 0.04, rot: 16 },
      ],
      3: [
        { x: -0.42, y: -0.18, rot: -18 },
        { x: 0.42, y: -0.08, rot: 16 },
        { x: 0.02, y: 0.28, rot: -8 },
      ],
      4: [
        { x: -0.42, y: -0.22, rot: -18 },
        { x: 0.42, y: -0.14, rot: 16 },
        { x: -0.36, y: 0.24, rot: 12 },
        { x: 0.38, y: 0.18, rot: -14 },
      ],
      5: [
        { x: -0.46, y: -0.24, rot: -18 },
        { x: 0.46, y: -0.16, rot: 16 },
        { x: -0.34, y: 0.22, rot: 12 },
        { x: 0.36, y: 0.2, rot: -14 },
        { x: 0.02, y: 0.02, rot: -4 },
      ],
    };

    const buildBurstGroups = (imageFiles, burstCount) => {
      const files = imageFiles.length ? imageFiles : ['1.jpg', '2.jpg'];
      if (!files.length) return Array.from({ length: burstCount }, () => []);

      if (burstCount <= 1) return [files.slice()];

      const finalImage = files[files.length - 1];
      const leadFiles = files.slice(0, -1);
      const distributedBursts = burstCount - 1;
      const groups = [];

      if (!leadFiles.length) {
        for (let index = 0; index < distributedBursts; index += 1) {
          groups.push([files[index % files.length]]);
        }
      } else if (leadFiles.length < distributedBursts) {
        for (let index = 0; index < distributedBursts; index += 1) {
          groups.push([leadFiles[index % leadFiles.length]]);
        }
      } else {
        let cursor = 0;
        for (let burstIndex = 0; burstIndex < distributedBursts; burstIndex += 1) {
          const remainingBursts = distributedBursts - burstIndex;
          const remainingFiles = leadFiles.length - cursor;
          const take = Math.ceil(remainingFiles / remainingBursts);
          groups.push(leadFiles.slice(cursor, cursor + take));
          cursor += take;
        }
      }

      groups.push([finalImage]);
      return groups;
    };

    const buildSequencePlan = (imageFiles) => {
      const burstCount = STAGE_BLUEPRINT.filter((entry) => entry.type === 'cards').length;
      const burstGroups = buildBurstGroups(imageFiles, burstCount);
      let burstIndex = 0;

      return STAGE_BLUEPRINT.map((entry) => {
        if (entry.type === 'panel') return entry;
        return {
          type: 'cards',
          files: burstGroups[burstIndex] || [],
          finalCenter: Boolean(entry.final),
          burstIndex: burstIndex++,
        };
      });
    };

    const buildBurstPlacements = (burstIndex, count, finalCenter = false) => {
      if (finalCenter) {
        return [{ x: 0, y: 0, rot: -4 }];
      }
      const center = BURST_STAGE_CENTERS[burstIndex % BURST_STAGE_CENTERS.length];
      const centerX = center.x * window.innerWidth;
      const centerY = center.y * window.innerHeight;
      const layout = BURST_LAYOUTS[Math.min(count, 5)] || BURST_LAYOUTS[5];

      return Array.from({ length: count }, (_, index) => {
        const preset = layout[index % layout.length];
        const ring = Math.floor(index / layout.length);
        const spreadX = window.innerWidth * 0.52 * (1 + ring * 0.48);
        const spreadY = window.innerHeight * 0.4 * (1 + ring * 0.44);
        return {
          x: Math.max(-window.innerWidth * 0.46, Math.min(window.innerWidth * 0.46, centerX + preset.x * spreadX)),
          y: Math.max(-window.innerHeight * 0.34, Math.min(window.innerHeight * 0.34, centerY + preset.y * spreadY)),
          rot: preset.rot + ring * (index % 2 === 0 ? -6 : 6),
        };
      });
    };

    // --- STATE ---
    const state = {
      scroll: 0,
      velocity: 0,
      targetSpeed: 0,
      mouseX: 0,
      mouseY: 0
    };

    const postRelay = (event, x, y, down) => {
      if (!window.parent || window.parent === window) return;
      window.parent.postMessage(
        { type: 'vvv-pointer-relay', source: 'intro', event, x, y, down, timestamp: performance.now() },
        window.location.origin
      );
    };

    const world    = document.getElementById('world');
    const viewport = document.getElementById('viewport');
    const items    = [];

    const attachCardImage = (imageEl, sources) => {
      if (!imageEl || !sources.length) return;
      let sourceIndex = 0;

      const loadNext = () => {
        if (sourceIndex >= sources.length) {
          imageEl.remove();
          return;
        }
        imageEl.src = sources[sourceIndex++];
      };

      imageEl.addEventListener('error', loadNext);
      loadNext();
    };

    // --- INIT ---
    async function init() {
      const fightImageFiles = await fetchFightImageFiles();
      const sequencePlan = buildSequencePlan(fightImageFiles);
      CONFIG.itemCount = sequencePlan.length;
      CONFIG.loopSize = CONFIG.itemCount * CONFIG.zGap;

      sequencePlan.forEach((entry, i) => {
        const el = document.createElement('div');
        el.className = 'item';

        if (entry.type === 'panel') {
          const panel = entry.panel;
          const txt = document.createElement('div');
          txt.className = `signal-card${panel.className ? ` ${panel.className}` : ''}`;
          txt.innerHTML = `
            <div class="signal-corners"></div>
            <div class="signal-kicker">${panel.kicker}</div>
            <div class="signal-main">${panel.main}</div>
            <div class="signal-lines">${panel.lines.map(line => `<div class="signal-line">${line}</div>`).join('')}</div>
          `;
          el.appendChild(txt);
          items.push({ el, type: 'text', x: 0, y: 0, rot: 0, baseZ: -i * CONFIG.zGap });
        } else {
          const placements = buildBurstPlacements(entry.burstIndex, entry.files.length, entry.finalCenter);

          entry.files.forEach((fileName, fileIndex) => {
            const cardEl = document.createElement('div');
            cardEl.className = 'item';

            const card = document.createElement('div');
            card.className = 'card';
            const cardId = String((entry.burstIndex + 1) * 100 + fileIndex + 1).padStart(4, '0');
            const imageSources = [buildFightImageUrl(fileName)].filter(Boolean);
            card.innerHTML = `
              <div class="card-media"></div>
              <div class="card-header">
                <span class="card-id">ID-${cardId}</span>
                <div style="width:10px;height:10px;background:var(--accent)"></div>
              </div>
              <div class="card-footer">
                <span>PROJECT ARES</span>
                <span>${FIGHTER_A} vs ${FIGHTER_B}</span>
              </div>
            `;
            const media = card.querySelector('.card-media');
            if (media && imageSources.length) {
              const img = document.createElement('img');
              img.className = 'card-bg-image';
              img.alt = '';
              img.loading = 'eager';
              media.appendChild(img);
              attachCardImage(img, imageSources);
            }
            cardEl.appendChild(card);

            const placement = placements[fileIndex] || placements[0] || { x: 0, y: 0, rot: 0 };
            items.push({
              el: cardEl,
              type: 'card',
              finalCenter: Boolean(entry.finalCenter),
              x: placement.x,
              y: placement.y,
              rot: placement.rot,
              baseZ: -i * CONFIG.zGap - fileIndex * (entry.finalCenter ? 0 : 260),
            });
            world.appendChild(cardEl);
          });

          return;
        }
        world.appendChild(el);
      });

      const finalCard = items.find((item) => item.type === 'card' && item.finalCenter);
      const doneDistance = finalCard
        ? -finalCard.baseZ + FINAL_CARD_FINISH_Z
        : items
            .filter((item) => item.type !== 'star')
            .reduce((maxDistance, item) => Math.max(maxDistance, -item.baseZ), 0) + TEXT_PASS_CAMERA_CUT_Z;
      DONE_AT = doneDistance / CONFIG.camSpeed + FINAL_CARD_COMPLETE_BUFFER_MS;

      // Stars (looping)
      for (let i = 0; i < CONFIG.starCount; i++) {
        const el = document.createElement('div');
        el.className = 'star';
        world.appendChild(el);
        items.push({
          el, type: 'star',
          x: (Math.random() - 0.5) * 3000,
          y: (Math.random() - 0.5) * 3000,
          baseZ: -Math.random() * CONFIG.loopSize
        });
      }

      const updateMouse = e => {
        state.mouseX = (e.clientX / window.innerWidth  - 0.5) * 2;
        state.mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
      };

      window.addEventListener('mousemove', updateMouse);
      window.addEventListener('pointermove', e => {
        updateMouse(e);
        postRelay('move', e.clientX, e.clientY);
      }, { passive: true });
      window.addEventListener('pointerdown', e => postRelay('down', e.clientX, e.clientY, true), { passive: true });
      window.addEventListener('pointerup', e => postRelay('up', e.clientX, e.clientY, false), { passive: true });
      window.addEventListener('pointercancel', e => postRelay('up', e.clientX, e.clientY, false), { passive: true });
      window.addEventListener('pointerleave', e => postRelay('leave', e.clientX, e.clientY, false), { passive: true });
      window.addEventListener('blur', () => postRelay('leave', window.innerWidth * 0.5, window.innerHeight * 0.5, false), { passive: true });
      window.addEventListener('keydown', e => {
        if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
        if (!/^[1-5]$/.test(e.key)) return;
        if (!window.parent || window.parent === window) return;
        e.preventDefault();
        window.parent.postMessage(
          { type: 'vvv-dev-jump-stage-request', stage: Number(e.key) },
          window.location.origin
        );
      });
    }

    // --- AUTO-SCROLL (no Lenis) ---
    // Start slightly behind so "EVALUATION STARTING" begins in the distance
    const AUTO_RATE = 0.375; // px/ms — half speed vs original
    let autoPos  = -800;    // pre-roll: puts item i=0 at vizZ=-2000 initially
    let prevTime = null;
    const TEXT_PASS_CAMERA_CUT_Z = 1800;
    const FINAL_CARD_FINISH_Z = 920;
    const FINAL_CARD_COMPLETE_BUFFER_MS = 5;

    // Stop after last card (i=14) has passed the camera + 1.5s buffer
    let DONE_AT = (CONFIG.itemCount - 1) * CONFIG.zGap / CONFIG.camSpeed + 1500; // ≈5980

    // --- HUD elements ---
    const feedbackVel = document.getElementById('vel-readout');
    const feedbackFPS = document.getElementById('fps');
    const coordEl     = document.getElementById('coord');
    let lastFpsTime = 0;

    // --- RAF LOOP ---
    function raf(time) {
      const delta = prevTime !== null ? Math.min(time - prevTime, 50) : 16;
      prevTime = time;

      autoPos += AUTO_RATE * delta;
      state.scroll      = autoPos;
      state.targetSpeed = AUTO_RATE * 16.67;

      const frameDelta = time - lastFpsTime;
      lastFpsTime = time;
      if (frameDelta > 0 && time % 10 < 1) feedbackFPS.innerText = Math.round(1000 / frameDelta);

      state.velocity += (state.targetSpeed - state.velocity) * 0.1;

      feedbackVel.innerText = Math.abs(state.velocity).toFixed(2);
      coordEl.innerText = Math.max(0, state.scroll).toFixed(0);

      const tiltX = state.mouseY * 5 - state.velocity * 0.5;
      const tiltY = state.mouseX * 5;
      world.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;

      const fov = 1000 - Math.min(Math.abs(state.velocity) * 10, 600);
      viewport.style.perspective = `${fov}px`;

      const cameraZ = state.scroll * CONFIG.camSpeed;

      items.forEach(item => {
        let vizZ;

        if (item.type === 'star') {
          // Stars loop infinitely for background depth
          const relZ = item.baseZ + cameraZ;
          const modC = CONFIG.loopSize;
          vizZ = ((relZ % modC) + modC) % modC;
          if (vizZ > 500) vizZ -= modC;
        } else {
          // Content items: no looping — appear in correct sequence
          vizZ = item.baseZ + cameraZ;
        }

        let alpha = 1;
        if (vizZ < -3000) alpha = 0;
        else if (vizZ < -2000) alpha = (vizZ + 3000) / 1000;
        if (item.type === 'text') {
          if (vizZ > TEXT_PASS_CAMERA_CUT_Z) alpha = 0;
        } else if (item.type === 'card') {
          if (vizZ > (item.finalCenter ? FINAL_CARD_FINISH_Z : TEXT_PASS_CAMERA_CUT_Z)) alpha = 0;
        } else if (vizZ > 100 && item.type !== 'star') alpha = 1 - ((vizZ - 100) / 400);
        if (alpha < 0) alpha = 0;

        item.el.style.opacity = alpha;

        if (alpha > 0) {
          let trans = `translate3d(${item.x}px, ${item.y}px, ${vizZ}px)`;

          if (item.type === 'star') {
            const stretch = Math.max(1, Math.min(1 + Math.abs(state.velocity) * 0.1, 10));
            trans += ` scale3d(1, 1, ${stretch})`;
          } else if (item.type === 'text') {
            trans += ` rotateZ(${item.rot}deg)`;
          } else {
            const t = time * 0.001;
            const float = Math.sin(t + item.x) * 10;
            trans += ` rotateZ(${item.rot}deg) rotateY(${float}deg)`;
          }

          item.el.style.transform = trans;
        }
      });

      if (autoPos >= DONE_AT) {
        window.parent.postMessage(
          { type: 'vvv-aaa-complete' },
          window.parent === window ? '*' : window.location.origin
        );
        return; // stop RAF
      }

      requestAnimationFrame(raf);
    }
    init().then(() => {
      requestAnimationFrame(raf);
    });
  })();
  </script>
</body>
</html>
