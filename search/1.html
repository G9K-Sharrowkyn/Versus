<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VS Search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body, * { cursor: none !important; }

    html, body {
      height: 100%; overflow: hidden;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
    }

    .stage {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .stage.off { display: none; }

    /* shared scanlines overlay */
    #scanlines {
      position: fixed; inset: 0; z-index: 200; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px,
        transparent 1px, transparent 3px
      );
    }

    /* ═══════════════════════════════════════════
       STAGE 1 — NETRUNNER STATION (iframe)
    ═══════════════════════════════════════════ */
    /* dopasuj tło do gradientu wnętrza iframe */
    #s1 { background: linear-gradient(0deg, #000 0%, #041728 100%); }

    .s1-iframe {
      position: absolute;
      top: 0; left: 0;
      /* render w 1/3 rozdzielczości → scale(3) powiększa 3× */
      width: 33.34%;
      height: 33.34%;
      border: none;
      transform: scale(3);
      transform-origin: top left;
    }

    /* transparent div that sits over the iframe, captures pointer for relay */
    .s1-ptr {
      position: absolute; inset: 0;
      z-index: 5; pointer-events: auto;
    }

    .s1-overlay {
      display: none;
    }

    .s1-btn {
      pointer-events: auto;
      padding: 0.55rem 2.2rem;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,85,78,0.8);
      color: rgba(255,85,78,1);
      font-family: 'Courier New', Courier, monospace;
      font-size: 0.82rem; letter-spacing: 0.22em;
      text-transform: uppercase; cursor: pointer;
      position: relative; overflow: hidden;
      filter: drop-shadow(0 0 8px rgba(255,85,78,0.7));
      transition: color 0.2s, background 0.2s;
    }
    .s1-btn:hover {
      background: rgba(255,85,78,0.15);
      filter: drop-shadow(0 0 14px rgba(255,85,78,1));
    }
    .s1-btn span { position: relative; z-index: 1; }

    /* ═══════════════════════════════════════════
       STAGE 2 — CYBERPUNK TERMINAL
    ═══════════════════════════════════════════ */
    #s2 {
      background: #0a0000;
      color: #db0e15;
      text-shadow: 0 0 5px rgba(219,14,21,0.8);
      font-size: clamp(18px, 2.7vw, 30px);
      animation: s2-shake 1.5s linear infinite;
    }
    @keyframes s2-shake {
      2%,64% { transform: translate(2px,0) skewX(0deg); }
      4%,60% { transform: translate(-2px,0) skewX(0deg); }
      62%    { transform: translate(0,0) skewX(4deg); }
    }

    .term-box {
      border: 0.15em solid #db0e15;
      box-shadow: 0 0 8px #db0e15, inset 0 0 6px rgba(219,14,21,0.08);
      padding: 2em 2.4em; max-width: 720px; width: 88%;
    }

    .term-heading {
      text-align: center; font-size: 1em;
      text-transform: uppercase; letter-spacing: 0.08em;
      border-bottom: 1px solid rgba(219,14,21,0.35);
      padding-bottom: 0.5em; margin-bottom: 1.2em;
    }

    .term-desc {
      font-size: 0.6em; opacity: 0.65;
      text-align: center; margin-bottom: 1.2em; line-height: 1.5;
    }

    .term-row {
      display: flex; align-items: center;
      gap: 0.8em; margin: 0.5em 0; font-size: 0.7em;
    }
    .term-lbl { min-width: 5.5em; opacity: 0.7; }
    .term-inp {
      flex: 1; background: rgba(219,14,21,0.07);
      border: 1px solid rgba(219,14,21,0.3);
      color: inherit; font-family: inherit; font-size: inherit;
      padding: 0.25em 0.55em; outline: none;
    }

    .term-status {
      text-align: center; margin-top: 1em;
      font-size: 0.7em; letter-spacing: 0.1em;
      min-height: 1.4em; transition: color 0.2s;
    }
    .term-status.ok {
      color: #22edfc;
      text-shadow: 0 0 8px #22edfc;
      animation: tblink 0.25s steps(1) 4;
    }
    @keyframes tblink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ═══════════════════════════════════════════
       STAGE 3 — HYDRA
    ═══════════════════════════════════════════ */
    #s3 {
      background: #0f0000; color: #ff6666;
      text-shadow: 0 0 4px red; text-align: center;
      font-size: clamp(12px, 2.2vw, 26px);
    }

    .hydra-box {
      border: 0.18em solid #ff6666;
      box-shadow: 0 0 4px red, inset 0 0 4px red;
      padding: 1.6em 2em;
      animation: s2-shake 1.5s linear infinite;
    }

    .h-spinner { font-size: 1.1em; margin-bottom: 0.4em; }
    .h-title   { font-size: 1em; letter-spacing: 0.04em; }
    .h-sub     { font-size: 0.6em; margin-top: 0.3em; opacity: 0.8; }
    .h-pct     { font-size: 0.65em; margin-top: 0.3em; }
    .h-bar     { font-size: 0.65em; margin-top: 0.5em; letter-spacing: 0.04em; }
    .h-bar-ul  { color: #fff; text-shadow: 0 0 4px #fff; }
    .h-done    { font-size: 1em; letter-spacing: 0.04em; }

    /* ═══════════════════════════════════════════
       STAGE 4 — GLITCH BURST
    ═══════════════════════════════════════════ */
    #s4 { background: #000; overflow: hidden; }

    /* ═══════════════════════════════════════════
       STAGE 5 — VersusVerseVault
    ═══════════════════════════════════════════ */
    #s5 { background: #000; overflow: hidden; }

    #s5::before {
      content: ''; position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 1px,
        transparent 1px, transparent 2px
      );
      pointer-events: none; z-index: 1;
      animation: s5noise 0.45s steps(4) infinite;
    }
    @keyframes s5noise {
      0% { transform: translateY(0px); }
      25%{ transform: translateY(-3px); }
      50%{ transform: translateY(2px); }
      75%{ transform: translateY(-1px); }
    }

    .s5-scan {
      position: fixed; top: -50vh; left: 0;
      width: 110vw; height: 200vh;
      background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.28) 50%);
      background-size: 100% 4px;
      pointer-events: none; z-index: 2;
      animation: s5scan 8s linear infinite;
    }
    @keyframes s5scan { 0%{transform:translateY(0)} 100%{transform:translateY(25vh)} }

    .s5-wrap { position: relative; z-index: 3; text-align: center; }

    .s5-text {
      font-size: clamp(1.8rem, 11vw, 8rem);
      font-weight: 900; color: #fff;
      letter-spacing: 0.04em; white-space: nowrap;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 20px rgba(233,69,96,0.45);
      position: relative; display: inline-block;
      animation: s5skew 4s infinite;
    }
    .s5-text::before, .s5-text::after {
      content: attr(data-text);
      position: absolute; top:0;left:0;
      width:100%;height:100%;
    }
    .s5-text::before {
      color: #e94560;
      text-shadow: 2px 0 0 #4e9eff, -2px 0 0 lime;
      z-index: -1;
      animation: s5g1 0.8s infinite linear alternate-reverse;
    }
    .s5-text::after {
      color: #4e9eff;
      text-shadow: 2px 0 0 #e94560, -2px 0 0 #ff0;
      z-index: -2;
      animation: s5g2 0.8s infinite linear alternate-reverse;
    }

    @keyframes s5skew {
      0%,10%,90%,100% { transform:skew(0deg); }
      2% { transform:skew(2deg); }
      4% { transform:skew(-2deg); }
      6% { transform:skew(1deg); }
      8% { transform:skew(-1deg); }
    }
    @keyframes s5g1 {
      0%,100% { clip-path:inset(0 0 0 0); transform:translate(0);    opacity:.8; }
      10%     { clip-path:inset(20% 0 30% 0); transform:translate(-5px,3px); opacity:1; }
      20%     { clip-path:inset(10% 0 60% 0); transform:translate(5px,-3px); opacity:.6; }
      30%     { clip-path:inset(40% 0 40% 0); transform:translate(-5px,5px); opacity:1; }
      40%     { clip-path:inset(70% 0 10% 0); transform:translate(5px,-5px); opacity:.7; }
      50%     { clip-path:inset(30% 0 50% 0); transform:translate(-3px,3px); opacity:.9; }
      60%     { clip-path:inset(50% 0 30% 0); transform:translate(3px,-3px); opacity:.5; }
      70%     { clip-path:inset(80% 0 10% 0); transform:translate(-4px,4px); opacity:.8; }
      80%     { clip-path:inset(15% 0 70% 0); transform:translate(4px,-4px); opacity:1; }
    }
    @keyframes s5g2 {
      0%,100% { clip-path:inset(0 0 0 0); transform:translate(0);    opacity:.8; }
      10%     { clip-path:inset(60% 0 20% 0); transform:translate(5px,-3px); opacity:.6; }
      20%     { clip-path:inset(30% 0 50% 0); transform:translate(-5px,3px); opacity:1; }
      30%     { clip-path:inset(10% 0 70% 0); transform:translate(5px,-5px); opacity:.7; }
      40%     { clip-path:inset(50% 0 30% 0); transform:translate(-3px,3px); opacity:.5; }
      50%     { clip-path:inset(80% 0 10% 0); transform:translate(3px,-3px); opacity:.9; }
      60%     { clip-path:inset(20% 0 60% 0); transform:translate(-4px,4px); opacity:1; }
      70%     { clip-path:inset(40% 0 30% 0); transform:translate(4px,-4px); opacity:.8; }
      80%     { clip-path:inset(5%  0 80% 0); transform:translate(-5px,5px); opacity:.6; }
    }

    /* ═══════════════════════════════════════════
       STAGE 6 — SEARCH INPUT (Cyberpunk Glitch)
    ═══════════════════════════════════════════ */
    #s6 {
      background: #0d0d0d;
      --primary: #00f2ea;
      --secondary: #a855f7;
      --mono: 'Courier New', Consolas, monospace;
      transition: opacity 0.45s ease;
    }
    #s6.collapsing { opacity: 0.25; pointer-events: none; }

    .s6-wrap {
      display: flex; flex-direction: column;
      align-items: center; gap: 1.8rem;
      padding: 2rem; font-family: var(--mono);
    }

    .s6-heading {
      font-size: 0.62rem; letter-spacing: 0.24em;
      text-transform: uppercase; color: rgba(0,242,234,0.45);
    }

    .s6-container {
      position: relative; width: min(460px, 90vw);
    }

    .s6-input {
      width: 100%; height: 3.5rem;
      background: rgba(13,13,13,0.85);
      border: none; border-bottom: 2px solid #333;
      outline: none; padding: 1rem 1rem 0;
      color: var(--primary); font-family: var(--mono);
      font-size: 1rem; caret-color: var(--primary);
      transition: border-color 0.3s ease;
      position: relative; z-index: 10;
    }

    .s6-label {
      position: absolute; top: 1rem; left: 1rem;
      color: rgba(229,229,229,0.55);
      text-transform: uppercase; letter-spacing: 0.1em;
      font-size: 0.82rem; pointer-events: none;
      transition: all 0.3s ease;
      font-family: var(--mono); z-index: 11;
    }
    .s6-input:focus + .s6-label,
    .s6-input:not(:placeholder-shown) + .s6-label {
      top: -1.4rem; left: 0; font-size: 0.68rem;
      opacity: 1; color: var(--primary);
    }
    .s6-input:focus + .s6-label::before,
    .s6-input:focus + .s6-label::after {
      content: attr(data-text);
      position: absolute; top:0;left:0;
      width:100%;height:100%; background:#1a1a1a;
    }
    .s6-input:focus + .s6-label::before {
      color: var(--secondary);
      animation: glitch-lbl 0.4s cubic-bezier(.25,.46,.45,.94) both;
    }
    .s6-input:focus + .s6-label::after {
      color: var(--primary);
      animation: glitch-lbl 0.4s cubic-bezier(.25,.46,.45,.94) reverse both;
    }
    @keyframes glitch-lbl {
      0%  { transform:translate(0);       clip-path:inset(0 0 0 0); }
      20% { transform:translate(-3px,1px);  clip-path:inset(50% 0 20% 0); }
      40% { transform:translate(2px,-1px);  clip-path:inset(20% 0 60% 0); }
      60% { transform:translate(-2px,1px);  clip-path:inset(80% 0 5%  0); }
      80% { transform:translate(2px,-2px);  clip-path:inset(30% 0 45% 0); }
      100%{ transform:translate(0);       clip-path:inset(0 0 0 0); }
    }

    .s6-border {
      position:absolute;inset:0; pointer-events:none;
      border: 1px solid rgba(0,242,234,0.2);
      opacity:0.5; transition:all 0.3s ease;
    }
    .s6-glow {
      position:absolute;inset:0; pointer-events:none;
      background: radial-gradient(ellipse at center, rgba(0,242,234,0.2) 0%, transparent 70%);
      opacity:0; transition:opacity 0.4s ease;
    }
    .s6-scanline {
      position:absolute;inset:0; pointer-events:none;
      background: linear-gradient(to bottom,
        transparent 0%, rgba(0,242,234,.1) 48%, rgba(0,242,234,.28) 50%,
        rgba(0,242,234,.1) 52%, transparent 100%);
      opacity:0;
    }
    .s6-data {
      position:absolute;bottom:2px;left:0;
      width:100%;height:0.28rem;
      display:flex; opacity:0;
      transition: opacity 0.3s ease 0.1s; pointer-events:none;
    }
    .s6-bar {
      flex-grow:1; background:#00f2ea;
      transform:scaleY(0); transform-origin:bottom;
    }
    .s6-corners { position:absolute;inset:0;pointer-events:none; }
    .s6-c {
      position:absolute; width:1rem;height:1rem;
      border:2px solid var(--primary); opacity:0.45;
      transition:all 0.3s ease;
    }
    .s6-c.tl{top:-.3rem;left:-.3rem;border-right:none;border-bottom:none;}
    .s6-c.tr{top:-.3rem;right:-.3rem;border-left:none;border-bottom:none;}
    .s6-c.bl{bottom:-.3rem;left:-.3rem;border-right:none;border-top:none;}
    .s6-c.br{bottom:-.3rem;right:-.3rem;border-left:none;border-top:none;}

    .s6-input:focus { border-color:transparent; }
    .s6-input:focus ~ .s6-border  { opacity:1; border-color:rgba(0,242,234,.5); }
    .s6-input:focus ~ .s6-corners .s6-c { width:1.25rem;height:1.25rem;border-width:3px;opacity:1; }
    .s6-input:focus ~ .s6-glow     { opacity:1; }
    .s6-input:focus ~ .s6-scanline { animation:scan-v 4s linear infinite; }
    .s6-input:focus ~ .s6-data     { opacity:1; }
    .s6-input:focus ~ .s6-data .s6-bar {
      animation: dpulse 2s infinite;
      animation-delay: calc(var(--i) * 0.1s);
    }
    @keyframes scan-v {
      0%   { opacity:0; transform:translateY(-100%); }
      25%  { opacity:0.5; }
      75%  { opacity:0.5; }
      100% { opacity:0; transform:translateY(100%); }
    }
    @keyframes dpulse {
      0%,100% { transform:scaleY(0.2); opacity:0.3; }
      50%     { transform:scaleY(1);   opacity:0.8; }
    }
  </style>
</head>
<body>

<div id="scanlines"></div>

<!-- ── STAGE 1: NETRUNNER STATION (oryginalna animacja w iframe) ── -->
<div id="s1" class="stage">
  <iframe
    class="s1-iframe"
    src="/anime/the-cyberpunk-station-for-netrunners/dist/index.html?v=10"
    title="The cyberpunk station for netrunners"
    sandbox="allow-scripts allow-same-origin allow-popups"
  ></iframe>
  <!-- pointer-capture layer: sits over iframe so window receives pointermove for relay -->
  <div class="s1-ptr" aria-hidden="true"></div>
  <div class="s1-overlay">
    <button id="s1-btn" class="s1-btn"><span>// LOADING... //</span></button>
  </div>
</div>

<!-- ── STAGE 2: CYBERPUNK TERMINAL ── -->
<div id="s2" class="stage off">
  <iframe src="/anime/cyberpunk-terminal/dist/index.html?v=2" style="position:absolute;inset:0;width:100%;height:100%;border:none;" sandbox="allow-scripts allow-same-origin"></iframe>
</div>

<!-- ── STAGE 3: HYDRA LOADING ── -->
<div id="s3" class="stage off">
  <div class="hydra-box">
    <div id="h-main">
      <p class="h-spinner" id="h-spin">[/]</p>
      <p class="h-title">&lt; SYSTEM REBOOTING &gt;</p>
      <p class="h-sub">VERSUS//VAULT v2.077 · RECOVERY SEQUENCE</p>
      <p class="h-pct">PROCESS: <span id="h-pct">0</span>%</p>
      <p class="h-bar" id="h-bar">&nbsp;</p>
    </div>
    <div id="h-done" style="display:none">
      <p class="h-done">REBOOTING SUCCESSFUL</p>
    </div>
  </div>
</div>

<!-- ── STAGE 4: GLITCH BURST ── -->
<div id="s4" class="stage off"></div>

<!-- ── STAGE 5: VersusVerseVault ── -->
<div id="s5" class="stage off">
  <div class="s5-scan"></div>
  <div class="s5-wrap">
    <div class="s5-text" data-text="VersusVerseVault">VersusVerseVault</div>
  </div>
</div>

<!-- ── STAGE 6: CYBERPUNK SEARCH ── -->
<div id="s6" class="stage off">
  <div class="s6-wrap">
    <p class="s6-heading">// FIGHTER DATABASE · QUERY INTERFACE //</p>
    <div class="s6-container">
      <input
        id="s6-input" class="s6-input"
        type="text" placeholder=" "
        autocomplete="off" autocapitalize="off"
        autocorrect="off" spellcheck="false"
        inputmode="search"
      />
      <label class="s6-label" for="s6-input" data-text="SEARCH_FIGHTER">SEARCH_FIGHTER</label>
      <div class="s6-border"></div>
      <div class="s6-scanline"></div>
      <div class="s6-glow"></div>
      <div class="s6-data">
        <div class="s6-bar" style="--i:0"></div><div class="s6-bar" style="--i:1"></div>
        <div class="s6-bar" style="--i:2"></div><div class="s6-bar" style="--i:3"></div>
        <div class="s6-bar" style="--i:4"></div><div class="s6-bar" style="--i:5"></div>
        <div class="s6-bar" style="--i:6"></div><div class="s6-bar" style="--i:7"></div>
        <div class="s6-bar" style="--i:8"></div><div class="s6-bar" style="--i:9"></div>
      </div>
      <div class="s6-corners">
        <div class="s6-c tl"></div><div class="s6-c tr"></div>
        <div class="s6-c bl"></div><div class="s6-c br"></div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  // ── helpers ──────────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const delay = ms => new Promise(r => setTimeout(r, ms));

  const showStage = n => {
    for (let i = 1; i <= 6; i++) {
      const el = $(`s${i}`);
      if (i === n) el.classList.remove('off');
      else         el.classList.add('off');
    }
  };

  // ── postMessage protocol ─────────────────────────────────────────────────────
  const searchEl  = $('s6');
  const inputEl   = $('s6-input');
  let collapseStarted = false, collapseNotified = false;
  let collapseTimers = [];
  let rAF_a = 0, rAF_b = 0, rAF_c = 0;
  let relayX = window.innerWidth * 0.5, relayY = window.innerHeight * 0.5;
  let disposeRelay = () => {};
  let searchActive = false;

  const post = msg => {
    if (window.parent && window.parent !== window)
      window.parent.postMessage(msg, window.location.origin);
  };

  const postRelay = (kind, x, y, down) =>
    post({ type:'vvv-pointer-relay', source:'search', event:kind, x, y, down, timestamp:performance.now() });

  const bindPointerRelay = () => {
    if (window.matchMedia?.('(pointer: coarse)').matches) return () => {};
    document.documentElement.classList.add('vvv-parent-cursor');
    const mv = e => { relayX=e.clientX; relayY=e.clientY; postRelay('move',relayX,relayY); };
    const dn = e => { relayX=e.clientX; relayY=e.clientY; postRelay('down',relayX,relayY,true); };
    const up = e => { relayX=e.clientX; relayY=e.clientY; postRelay('up',relayX,relayY,false); };
    const lv = () => postRelay('leave',relayX,relayY,false);
    window.addEventListener('pointermove',mv,{passive:true});
    window.addEventListener('pointerdown',dn,{passive:true});
    window.addEventListener('pointerup',up,{passive:true});
    window.addEventListener('pointercancel',up,{passive:true});
    window.addEventListener('pointerleave',lv,{passive:true});
    window.addEventListener('blur',lv,{passive:true});
    return () => {
      window.removeEventListener('pointermove',mv);
      window.removeEventListener('pointerdown',dn);
      window.removeEventListener('pointerup',up);
      window.removeEventListener('pointercancel',up);
      window.removeEventListener('pointerleave',lv);
      window.removeEventListener('blur',lv);
      document.documentElement.classList.remove('vvv-parent-cursor');
    };
  };

  const buildHandoff = () => {
    const wrap = $('s6-input');
    if (!wrap) return null;
    const r  = wrap.getBoundingClientRect();
    const fr = window.frameElement instanceof Element ? window.frameElement.getBoundingClientRect() : null;
    const ox = fr ? fr.left : 0, oy = fr ? fr.top : 0;
    return { x: ox+r.left+r.width/2, y: oy+r.top+r.height/2, width:r.width, height:r.height };
  };

  const clearCollapseTimers = () => {
    collapseTimers.forEach(id => clearTimeout(id));
    collapseTimers = [];
  };
  const clearRAFs = () => {
    [rAF_a,rAF_b,rAF_c].forEach(id => id && cancelAnimationFrame(id));
    rAF_a = rAF_b = rAF_c = 0;
  };

  const startCollapse = () => {
    if (!searchActive || collapseStarted) return;
    collapseStarted = true; collapseNotified = false;
    clearCollapseTimers();
    searchEl.classList.add('collapsing');
    collapseTimers.push(setTimeout(() => {
      if (collapseNotified) return;
      collapseNotified = true;
      post({ type:'vvv-search-collapsed', handoff:buildHandoff() });
    }, 480));
  };

  const resetCollapse = () => {
    collapseStarted = false; collapseNotified = false;
    clearCollapseTimers(); clearRAFs();
    searchEl.classList.remove('collapsing');
  };

  const primeCollapsed = () => {
    if (!searchActive) return;
    collapseStarted = true;
    clearCollapseTimers(); clearRAFs();
    searchEl.classList.add('collapsing');
    post({ type:'vvv-search-primed', handoff:buildHandoff() });
  };

  const expandFromPrime = () => {
    collapseStarted = false; collapseNotified = false;
    clearCollapseTimers(); clearRAFs();
    rAF_a = requestAnimationFrame(() => {
      rAF_a = 0;
      void searchEl.offsetWidth;
      rAF_b = requestAnimationFrame(() => {
        rAF_b = 0;
        searchEl.classList.remove('collapsing');
        rAF_c = requestAnimationFrame(() => { rAF_c = 0; });
      });
    });
  };

  window.addEventListener('message', e => {
    if (e.origin !== window.location.origin) return;
    const p = e.data;
    if (!p || typeof p !== 'object') return;
    if (p.type === 'vvv-terminal-submit')        { showStage(3); runHydra(); return; }
    if (p.type === 'vvv-search-collapse')        { startCollapse();   return; }
    if (p.type === 'vvv-search-prime-collapsed') { primeCollapsed();   return; }
    if (p.type === 'vvv-search-expand')          { expandFromPrime();  return; }
    if (p.type === 'vvv-search-reset')           { resetCollapse(); if (searchActive) notifyReady(); }
  });

  inputEl?.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const q = String(inputEl.value || '').trim();
    if (q) post({ type:'vvv-search-submit', query:q });
  });

  const focusInput = () => {
    if (!inputEl || document.body.classList.contains('search-collapsing')) return;
    inputEl.focus({ preventScroll:true });
  };

  const notifyReady = () => post({ type:'vvv-search-ready' });

  const activateSearch = () => {
    searchActive = true;
    resetCollapse();
    notifyReady();
    if (inputEl) {
      inputEl.name = `vvv-search-${Math.random().toString(36).slice(2)}`;
      inputEl.autocomplete = 'off';
      inputEl.value = '';
      setTimeout(focusInput, 80);
    }
  };

  // ── STAGE 1 → button ─────────────────────────────────────────────────────────
  $('s1-btn').addEventListener('click', () => {
    showStage(2);
  });

  // ── STAGE 1 → let breach animation play fully, then transition ───────────────
  // When .breachButton becomes visible: drop .s1-ptr so hover/clicks reach iframe.
  // On breach click: poll .breachCover opacity → when it peaks → showStage(2).
  const s1IFrame = document.querySelector('.s1-iframe');
  const s1Ptr    = document.querySelector('.s1-ptr');

  s1IFrame.addEventListener('load', () => {
    try {
      const iDoc = s1IFrame.contentWindow.document;
      const iWin = s1IFrame.contentWindow;

      const enableBreachClick = () => {
        const btn = iDoc.querySelector('.breachButton');
        if (!btn) return;
        const cs = iWin.getComputedStyle(btn);
        if (cs.display === 'none' || parseFloat(cs.opacity) <= 0.1) return;

        observer.disconnect();
        s1Ptr.style.pointerEvents = 'none'; // let hover + clicks reach iframe

        // Re-establish cursor relay through Svelte iframe's document.
        // The iframe is CSS-scaled (scale(3) from 33.34%), so e.clientX/Y are
        // in iframe's own coordinate space (1/3 of the parent viewport).
        // Multiply by the rendered/intrinsic ratio to convert back to parent coords.
        const iframeScale = () => {
          const r = s1IFrame.getBoundingClientRect();
          return { r, kx: r.width / s1IFrame.offsetWidth, ky: r.height / s1IFrame.offsetHeight };
        };
        iDoc.addEventListener('pointermove', e => {
          const { r, kx, ky } = iframeScale();
          postRelay('move', r.left + e.clientX * kx, r.top + e.clientY * ky);
        }, { passive: true });
        iDoc.addEventListener('pointerdown', e => {
          const { r, kx, ky } = iframeScale();
          postRelay('down', r.left + e.clientX * kx, r.top + e.clientY * ky, true);
        }, { passive: true });
        iDoc.addEventListener('pointerup', e => {
          const { r, kx, ky } = iframeScale();
          postRelay('up', r.left + e.clientX * kx, r.top + e.clientY * ky, false);
        }, { passive: true });

        btn.addEventListener('click', () => {
          const cover = iDoc.querySelector('.breachCover');
          let done = false;
          const doTransition = () => { if (done) return; done = true; showStage(2); };

          if (cover) {
            const poll = setInterval(() => {
              if (parseFloat(iWin.getComputedStyle(cover).opacity) > 0.85) {
                clearInterval(poll);
                setTimeout(doTransition, 400);
              }
            }, 100);
            setTimeout(() => { clearInterval(poll); doTransition(); }, 8000);
          } else {
            setTimeout(doTransition, 5000);
          }
        }, { once: true });
      };

      const observer = new MutationObserver(enableBreachClick);
      observer.observe(iDoc.documentElement, {
        subtree: true, attributes: true, childList: true,
        attributeFilter: ['style', 'class']
      });
      enableBreachClick();
    } catch (err) { /* cross-origin guard */ }
  });


  // ── STAGE 3: loading bar ──────────────────────────────────────────────────────
  const runHydra = async () => {
    const spin = $('h-spin'), pct = $('h-pct'), bar = $('h-bar');
    const main = $('h-main'), done = $('h-done');
    main.style.display = ''; done.style.display = 'none';
    pct.textContent = '0'; bar.textContent = '';

    const MAX = 24, LOADED = '#', EMPTY = '.';
    const vals = Array(MAX).fill(EMPTY);
    const frames = ['/','-','\\','|'];
    let fi = 0;
    const spinTimer = setInterval(() => {
      spin.textContent = `[${frames[fi++ % 4]}]`;
    }, 110 + Math.random() * 80);

    await new Promise(resolve => {
      const tick = setInterval(() => {
        const emptyIdx = vals.lastIndexOf(EMPTY);
        if (emptyIdx === -1) { clearInterval(tick); resolve(); return; }
        vals[emptyIdx] = LOADED;
        const loaded = vals.filter(c => c === LOADED).length;
        pct.textContent = Math.floor(loaded / MAX * 100);
        const ls = vals.slice(0, loaded).join('');
        const us = vals.slice(loaded).join('');
        bar.innerHTML = `(${ls}<span class="h-bar-ul">${us}</span>)`;
      }, 75 + Math.random() * 200);
    });

    clearInterval(spinTimer);
    pct.textContent = '100';
    bar.innerHTML = `(${'#'.repeat(MAX)})`;
    await delay(400);

    main.style.display = 'none';
    done.style.display = '';
    await delay(700);
    runGlitchBurst();
  };

  // ── STAGE 4: glitch burst ─────────────────────────────────────────────────────
  const runGlitchBurst = () => {
    showStage(4);
    const s4 = $('s4');
    s4.innerHTML = '';
    const COLORS = ['#db0e15','#0cf','#ff0','#fff','#a855f7','#f80','#0f0'];
    let frame = 0;
    const iv = setInterval(() => {
      s4.innerHTML = '';
      const n = 4 + Math.floor(Math.random() * 9);
      for (let i = 0; i < n; i++) {
        const b = document.createElement('div');
        const top = Math.random() * 100;
        const h   = 1 + Math.random() * 9;
        b.style.cssText = `position:absolute;left:0;right:0;top:${top}%;height:${h}%;`
          + `background:${COLORS[Math.floor(Math.random()*COLORS.length)]};`
          + `mix-blend-mode:screen;opacity:${0.35 + Math.random()*0.65}`;
        s4.appendChild(b);
      }
      s4.style.transform = `translateX(${(Math.random()-.5)*28}px) skewX(${(Math.random()-.5)*4}deg)`;
      frame++;
      if (frame > 22) {
        clearInterval(iv);
        s4.style.transition = 'opacity 0.35s ease';
        s4.style.opacity = '0';
        setTimeout(() => { showStage(5); setTimeout(runSearchStage, 5000); }, 380);
      }
    }, 70);
  };

  // ── STAGE 6 ───────────────────────────────────────────────────────────────────
  const runSearchStage = () => {
    showStage(6);
    activateSearch();
  };

  // ── BOOT ──────────────────────────────────────────────────────────────────────
  window.addEventListener('load', () => {
    showStage(1);
    // Relay pointer events od razu — iframe zajmuje cały ekran podczas intro
    disposeRelay = bindPointerRelay();
  });
  window.addEventListener('beforeunload', () => { disposeRelay(); });
})();
</script>
</body>
</html>
