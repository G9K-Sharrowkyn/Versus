<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cyberpunk terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Rajdhani:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; cursor: none !important; }

    html, body {
      height: 100%; overflow: hidden;
      background: #0a0000;
      color: #db0e15;
      font-family: 'Rajdhani', 'Courier New', monospace;
      font-size: clamp(14px, 2.2vw, 26px);
      text-shadow: 0 0 5px rgba(219,14,21,0.8);
      animation: s2-shake 1.5s linear infinite;
    }

    @keyframes s2-shake {
      2%,64% { transform: translate(2px,0)  skewX(0deg); }
      4%,60% { transform: translate(-2px,0) skewX(0deg); }
      62%    { transform: translate(0,0)    skewX(4deg); }
    }

    /* scanlines */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 100; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px,
        transparent 1px, transparent 3px
      );
    }

    .wrap {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }

    .term-box {
      border: 0.15em solid #db0e15;
      box-shadow: 0 0 8px #db0e15, inset 0 0 6px rgba(219,14,21,0.08);
      padding: 2em 2.4em;
      max-width: 720px; width: 88%;
    }

    .term-heading {
      text-align: center; font-size: 1em;
      text-transform: uppercase; letter-spacing: 0.08em;
      border-bottom: 1px solid rgba(219,14,21,0.35);
      padding-bottom: 0.5em; margin-bottom: 1.2em;
    }

    .term-desc {
      font-size: 0.62em; opacity: 0.7;
      text-align: center; margin-bottom: 1.4em;
      line-height: 1.6; text-transform: uppercase; letter-spacing: 0.04em;
    }

    .term-row {
      display: flex; align-items: center;
      gap: 0.8em; margin: 0.55em 0; font-size: 0.7em;
    }
    .term-lbl {
      min-width: 6em; opacity: 0.7;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .term-inp {
      flex: 1;
      background: rgba(219,14,21,0.07);
      border: 1px solid rgba(219,14,21,0.3);
      color: inherit; font-family: inherit; font-size: inherit;
      text-shadow: inherit;
      padding: 0.3em 0.6em; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .term-inp:focus {
      border-color: #db0e15;
      box-shadow: 0 0 8px rgba(219,14,21,.5);
    }

    .term-submit {
      display: block; margin: 1.2em auto 0;
      padding: 0.4em 2em;
      border: 1px solid rgba(219,14,21,.6);
      background: rgba(219,14,21,.1);
      color: inherit; font-family: inherit; font-size: 0.7em;
      text-transform: uppercase; letter-spacing: 0.1em;
      text-shadow: inherit;
      transition: background .2s, box-shadow .2s;
    }
    .term-submit:hover {
      background: rgba(219,14,21,.25);
      box-shadow: 0 0 10px rgba(219,14,21,.6);
    }

    .term-status {
      text-align: center; margin-top: 0.8em;
      font-size: 0.65em; letter-spacing: 0.1em;
      min-height: 1.4em; transition: color .2s;
    }
    .term-status.ok {
      color: #22edfc;
      text-shadow: 0 0 8px #22edfc;
      animation: tblink 0.25s steps(1) 4;
    }
    @keyframes tblink { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="term-box">
      <div class="term-heading">NEXUS LINK ESTABLISHED</div>
      <p class="term-desc">
        Welcome to <b>VERSUS//VAULT</b> — Battle data nexus.<br>
        Enter NETRUNNER credentials to proceed.
      </p>
      <div class="term-row">
        <span class="term-lbl">Login</span>
        <input class="term-inp" id="t-login" type="text" readonly>
      </div>
      <form id="auth-form">
        <div class="term-row">
          <span class="term-lbl">Password</span>
          <input class="term-inp" id="t-pass" type="password" maxlength="32"
            placeholder="________" autocomplete="new-password">
        </div>
        <div class="term-status" id="t-status">&nbsp;</div>
        <button class="term-submit" type="submit">[ AUTHENTICATE ]</button>
      </form>
    </div>
  </div>

  <script>
  (() => {
    const loginEl  = document.getElementById('t-login');
    const passEl   = document.getElementById('t-pass');
    const statusEl = document.getElementById('t-status');

    // ── auto-type login ───────────────────────────────────────────
    const LOGIN_TEXT = 'GHOST_7';
    let i = 0;
    const typeLogin = () => {
      if (i < LOGIN_TEXT.length) {
        loginEl.value += LOGIN_TEXT[i++];
        setTimeout(typeLogin, 90 + Math.random() * 60);
      } else {
        passEl.focus({ preventScroll: true });
      }
    };
    setTimeout(typeLogin, 600);

    // ── pointer relay → parent (search/1.html) → App.tsx ─────────
    const relay = (kind, e, down) =>
      window.parent.postMessage(
        { type:'vvv-pointer-relay', source:'search', event:kind,
          x: e.clientX, y: e.clientY, down: !!down, timestamp: performance.now() },
        '*'
      );
    document.addEventListener('pointermove',  e => relay('move', e),       { passive:true });
    document.addEventListener('pointerdown',  e => relay('down', e, true), { passive:true });
    document.addEventListener('pointerup',    e => relay('up',   e, false),{ passive:true });
    document.addEventListener('pointercancel',e => relay('up',   e, false),{ passive:true });

    // ── submit ────────────────────────────────────────────────────
    document.getElementById('auth-form').addEventListener('submit', e => {
      e.preventDefault();
      if (!passEl.value.trim()) {
        statusEl.textContent = 'PASSWORD REQUIRED';
        passEl.focus();
        return;
      }
      passEl.readOnly = true;
      statusEl.textContent = 'AUTHENTICATING...';
      statusEl.className = 'term-status';
      setTimeout(() => {
        statusEl.textContent = 'CLEARANCE VERIFIED — GHOST_7';
        statusEl.className = 'term-status ok';
        setTimeout(() => {
          window.parent.postMessage({ type: 'vvv-terminal-submit' }, '*');
        }, 700);
      }, 900);
    });
  })();
  </script>
</body>
</html>
