<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cyberpunk terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    html, body, * { cursor: none !important; box-sizing: border-box; }

    body, html {
      margin: 0; padding: 0;
      height: 100%;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      color: #db0e15;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 26px;
      font-weight: 300;
      text-shadow: 0 0 5px rgba(219,14,21,.8);
      background: #000;
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    /* ── CRT scanlines ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      z-index: 10; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.13) 0px, rgba(0,0,0,0.13) 1px,
        transparent 1px, transparent 3px
      );
    }

    /* ── CRT flicker ── */
    body::after {
      content: " ";
      display: block;
      position: fixed; top:0; left:0; bottom:0; right:0;
      z-index: 11; pointer-events: none;
      background: rgba(49,45,45,.1);
      opacity: 0;
      animation: flicker .15s infinite, steady 4s;
    }

    @keyframes flicker {
      0%  { opacity:.86139 } 5%  { opacity:.12793 } 10% { opacity:.36759 }
      15% { opacity:.9766  } 20% { opacity:.61364 } 25% { opacity:.94477 }
      30% { opacity:.57811 } 35% { opacity:.03416 } 40% { opacity:.21835 }
      45% { opacity:.62054 } 50% { opacity:.89452 } 55% { opacity:.89997 }
      60% { opacity:.37872 } 65% { opacity:.04929 } 70% { opacity:.14477 }
      75% { opacity:.27512 } 80% { opacity:.84701 } 85% { opacity:.85952 }
      90% { opacity:.76553 } 95% { opacity:.91372 } 100%{ opacity:.05536 }
    }
    @keyframes steady {
      from { background: rgba(255,230,230,.1); }
      to   { background: rgba(49,45,45,.1); }
    }

    /* ── CRT turn-on ── */
    .container { left:0; right:0; position:absolute; top:50%; transform:translate(0,-50%); }

    .container.on > .screen {
      animation: turn-on 2s linear;
      animation-fill-mode: forwards;
    }
    @keyframes turn-on {
      0%  { transform:scale(1,.8)         translate3d(0,0,0);      opacity:1; }
      5%  { transform:scale(1.091,1.342)  translate3d(0,100%,0); }
      10% { transform:scale(.631,1.407)   translate3d(0,-100%,0); }
      15% { transform:scale(.751,1.341)   translate3d(0,100%,0); }
      20% { transform:scale(.962,1.369)   translate3d(0,-100%,0); }
      25% { transform:scale(1.135,1.027)  translate3d(0,100%,0); }
      30% { transform:scale(.970,.711)    translate3d(0,-100%,0); }
      35% { transform:scale(.607,1.311)   translate3d(0,100%,0); }
      40% { transform:scale(.786,.933)    translate3d(0,-100%,0); }
      45% { transform:scale(1.386,1.144)  translate3d(0,100%,0); }
      50% { transform:scale(.700,.904)    translate3d(0,-100%,0); }
      51% { transform:scale(1,1)          translate3d(0,0,0); filter:brightness(1) saturate(1); opacity:0; }
      100%{ transform:scale(1,1)          translate3d(0,0,0); filter:contrast(1) brightness(1.2) saturate(1.3); opacity:1; }
    }

    /* ── Title ── */
    .screen::after {
      content: '';
      display: block;
      margin: 4px auto 0;
      width: 100%; max-width: 480px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(219,14,21,.6), transparent);
    }

    .title {
      text-transform: uppercase;
      text-align: center;
      font-size: 1em;
      font-weight: 300;
      margin: 0 0 8px;
      letter-spacing: 0.06em;
    }
    .title::before { content: '── '; opacity: .6; }
    .title::after  { content: ' ──'; opacity: .6; }

    /* ── Outer box (CSS border instead of images) ── */
    .box--outer {
      position: relative;
      margin: 0 auto;
      width: 90%; max-width: 1080px;
      border: 1px solid rgba(219,14,21,.7);
      box-shadow: 0 0 14px rgba(219,14,21,.35), inset 0 0 10px rgba(219,14,21,.08);
    }

    .box {
      display: inline-block;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
    }

    .box--inner {
      display: inline-block;
      width: calc(100% - 105px);
    }
    .box--inner::before, .box--inner::after {
      content: '';
      display: block;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(219,14,21,.5) 30%, rgba(219,14,21,.5) 70%, transparent);
      margin: 8px 0;
      opacity: .5;
    }

    /* ── Content ── */
    .content {
      position: relative;
      display: block;
      max-height: 600px; min-height: 400px; height: 100%;
    }
    .content .holder {
      left: 0; right: 0;
      position: absolute;
      top: 50%;
      transform: translate(0,-50%);
    }

    /* ── Form layout ── */
    .col.col__left, .col.col__center { display: inline-block; }
    .col.col__left   { width: 130px; }
    .col.col__center { width: 350px; margin-right: 130px; }
    .label::after    { content: ':'; margin-left: -15px; display: inline-block; }

    #login, #password {
      border: 2px solid rgba(219,14,21,.75);
      margin: 10px 0; padding: 10px;
      width: auto; max-width: 100%;
      outline: 0;
      background: rgba(219,14,21,.04);
      color: inherit; font: inherit; line-height: normal;
      transition: border-color .2s, box-shadow .2s;
    }
    #password:focus {
      border-color: #db0e15;
      box-shadow: 0 0 8px rgba(219,14,21,.6);
    }

    #submit {
      border: 1px solid rgba(219,14,21,.6);
      margin: 20px; padding: 10px 40px;
      outline: 0;
      background: rgba(219,14,21,.12);
      color: inherit; font: inherit;
      text-transform: uppercase;
      transition: background .2s, box-shadow .2s;
    }
    #submit:hover {
      background: rgba(219,14,21,.28);
      box-shadow: 0 0 12px rgba(219,14,21,.7);
    }

    /* ── Status line ── */
    #status {
      text-align: center;
      min-height: 1.2em;
      font-size: .75em;
      letter-spacing: .1em;
      margin-top: 6px;
      transition: color .2s;
    }
    #status.ok {
      color: #22edfc;
      text-shadow: 0 0 8px #22edfc;
      animation: blink .25s steps(1) 4;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── Flash ── */
    .flash { animation: flashText 1s ease-out alternate infinite; }
    @keyframes flashText { 0%{opacity:.3} 100%{opacity:1} }

    /* ── Responsive ── */
    @media (max-width:1260px) {
      .col.col__center, .col.col__left { display:block; width:auto; margin:0; }
      .content { height:440px; }
    }
    @media (max-width:600px) {
      .container { font-size:.8em; }
      #login, #password { max-width:70%; }
    }
  </style>
</head>

<body>
  <div class="container on">
    <div class="screen">
      <h3 class="title">NEXUS LINK ESTABLISHED</h3>
      <div class="box--outer">
        <div class="box">
          <div class="box--inner">
            <div class="content">
              <div class="holder">
                <b>Welcome to VERSUS//VAULT</b> — Battle data nexus.<br>
                Enter NETRUNNER credentials to proceed.
                <br><br>
                <div class="row">
                  <div class="col col__left label">Login</div>
                  <div class="col col__center">
                    <input type="text" id="login" maxlength="32" readonly>
                  </div>
                </div>
                <form id="auth-form">
                  <div class="row">
                    <div class="col col__left label">Password</div>
                    <div class="col col__center">
                      <input type="password" id="password" maxlength="32" placeholder="________" autocomplete="new-password">
                    </div>
                  </div>
                  <div id="status">&nbsp;</div>
                  <div class="row">
                    <button type="submit" id="submit">[authenticate]</button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const loginEl  = document.getElementById('login');
    const passEl   = document.getElementById('password');
    const statusEl = document.getElementById('status');

    // ── Auto-type login ───────────────────────────────────────────
    const LOGIN_TEXT = 'GHOST_7';
    let i = 0;
    const typeLogin = () => {
      if (i < LOGIN_TEXT.length) {
        loginEl.value += LOGIN_TEXT[i++];
        setTimeout(typeLogin, 90 + Math.random() * 60);
      } else {
        // focus password after login typed
        passEl.focus({ preventScroll: true });
      }
    };
    setTimeout(typeLogin, 700);

    // ── Submit → notify parent ────────────────────────────────────
    document.getElementById('auth-form').addEventListener('submit', e => {
      e.preventDefault();
      if (!passEl.value.trim()) {
        statusEl.textContent = 'PASSWORD REQUIRED';
        passEl.focus();
        return;
      }
      statusEl.textContent = 'AUTHENTICATING...';
      statusEl.className = '';
      setTimeout(() => {
        statusEl.textContent = 'CLEARANCE VERIFIED — GHOST_7';
        statusEl.className = 'ok';
        setTimeout(() => {
          window.parent.postMessage({ type: 'vvv-terminal-submit' }, '*');
        }, 700);
      }, 900);
    });
  })();
  </script>
</body>
</html>
